name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files require gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Validate Wardveil quarantine target contract
        run: python3 scripts/validate_wardveil_quarantine_target.py
      - name: Type-check Drive quarantine target Worker
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp" cloudflare/quarantine-target/node_modules' EXIT
          cd "$tmp"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-save --package-lock=false typescript@5.9.2 @cloudflare/workers-types@5.20260827.1 >/dev/null
          cd "$GITHUB_WORKSPACE"
          ln -s "$tmp/node_modules" cloudflare/quarantine-target/node_modules
          "$tmp/node_modules/.bin/tsc" --noEmit -p cloudflare/quarantine-target/tsconfig.json

  postgres:
    name: PostgreSQL schema isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drive_test
          POSTGRES_USER: drive
          POSTGRES_PASSWORD: drive-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U drive -d drive_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Apply migrations
        shell: bash
        run: |
          for migration in migrations/*.sql; do
            docker run --rm --network host \
              -e PGPASSWORD=drive-test-only \
              -v "$PWD:/workspace:ro" \
              postgres:16-alpine \
              psql -h 127.0.0.1 -U drive -d drive_test -v ON_ERROR_STOP=1 -f "/workspace/$migration"
          done
      - name: Run schema isolation regression
        shell: bash
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=drive-test-only \
            -v "$PWD:/workspace:ro" \
            postgres:16-alpine \
            psql -h 127.0.0.1 -U drive -d drive_test -v ON_ERROR_STOP=1 -f /workspace/tests/sql/schema_isolation.sql
